# Offline demo: the frontend against scripts/demo-api.mjs, which serves the
# three public-domain books in fixtures/books/ with the backend's routes.
# No network access, no API keys, no ../gutenberg_backend checkout needed.
#
#   docker compose -f compose.demo.yml up --build
#   open http://localhost:3600/book/1342
services:
  api:
    image: node:22-alpine
    working_dir: /demo
    command: ["node", "scripts/demo-api.mjs"]
    environment:
      PORT: "8000"
      CORS_ORIGINS: http://localhost:3600
    volumes:
      - ./scripts:/demo/scripts:ro
      - ./fixtures:/demo/fixtures:ro
    ports: ["8600:8000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8600
    environment:
      API_BASE_URL_SERVER: http://api:8000
    ports: ["3600:3000"]
    depends_on:
      api: { condition: service_healthy }
